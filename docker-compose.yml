version: '3.8'

services:
  # PostgreSQL для Nextcloud
  nextcloud-db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: ${NEXTCLOUD_DB_NAME:-nextcloud}
      POSTGRES_USER: ${NEXTCLOUD_DB_USER:-nextcloud}
      POSTGRES_PASSWORD: ${NEXTCLOUD_DB_PASSWORD:-nextcloud123!@}
    volumes:
      - nextcloud_db_data:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d/
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${NEXTCLOUD_DB_USER:-nextcloud}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network
    restart: unless-stopped

  # FastAPI приложение
  app:
    build: .
    environment:
      # FastAPI настройки
      APP_NAME: ${APP_NAME:-PhotoClassifier}
      DEBUG: ${DEBUG:-false}

      # Nextcloud подключение
      NEXTCLOUD_URL: ${NEXTCLOUD_URL:-http://nextcloud:80}
      NEXTCLOUD_USERNAME: ${NEXTCLOUD_ADMIN_USER:-admin}
      NEXTCLOUD_PASSWORD: ${NEXTCLOUD_ADMIN_PASSWORD:-admin123!@}

      # База данных (если используете)
      DATABASE_URL: postgresql://${APP_DB_USER:-appuser}:${APP_DB_PASSWORD:-apppass123!@}@app-db:5432/${APP_DB_NAME:-appdb}

      # ML модель
      MODEL_PATH: ${MODEL_PATH:-./models/classifier.pth}

      # Логирование
      LOG_LEVEL: ${LOG_LEVEL:-INFO}

    ports:
      - "8877:8877"
    depends_on:
      app-db:
        condition: service_healthy
      nextcloud:
        condition: service_started
    volumes:
      - ./logs:/app/logs
      - ./models:/app/models  # Если модели локально
      - ./uploads:/app/uploads  # Для временных файлов
    networks:
      - app-network
    restart: unless-stopped

  # Nextcloud сервер
  nextcloud:
    image: nextcloud:33-apache
    environment:
      POSTGRES_HOST: nextcloud-db
      POSTGRES_DB: ${NEXTCLOUD_DB_NAME:-nextcloud}
      POSTGRES_USER: ${NEXTCLOUD_DB_USER:-nextcloud}
      POSTGRES_PASSWORD: ${NEXTCLOUD_DB_PASSWORD:-nextcloud123!@}

      NEXTCLOUD_ADMIN_USER: ${NEXTCLOUD_ADMIN_USER:-admin}
      NEXTCLOUD_ADMIN_PASSWORD: ${NEXTCLOUD_ADMIN_PASSWORD:-admin123!@}
      NEXTCLOUD_TRUSTED_DOMAINS: |
        localhost
        127.0.0.1
        nextcloud
        nextcloud:80
        app

      NEXTCLOUD_FILELOCKING_ENABLED: "true"
      NEXTCLOUD_FILELOCKING_TTL: "360"
      NEXTCLOUD_BACKGROUNDJOBS_MODE: "ajax"
      NEXTCLOUD_AUTOINSTALL: "false"

    ports:
      - "30540:80"
    volumes:
      - nextcloud_data:/var/www/html/data
      - nextcloud_config:/var/www/html/config
    depends_on:
      nextcloud-db:
        condition: service_healthy
    networks:
      - app-network
    restart: unless-stopped


networks:
  app-network:
    driver: bridge

volumes:
  app_db_data:
  nextcloud_db_data:
  nextcloud_data:
  nextcloud_config:
  redis_data: