services:
  nextcloud-db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: ${NEXTCLOUD_DB_NAME:-nextcloud}
      POSTGRES_USER: ${NEXTCLOUD_DB_USER:-nextcloud}
      POSTGRES_PASSWORD: ${NEXTCLOUD_DB_PASSWORD:?NEXTCLOUD_DB_PASSWORD must be set}
    volumes:
      - nextcloud_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${NEXTCLOUD_DB_USER:-nextcloud}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network
    restart: unless-stopped
    mem_limit: 512m
    cpus: 1.0

  app:
    build: .
    environment:
      NEXTCLOUD_URL: http://nextcloud:80
      NEXTCLOUD_USER: ${NEXTCLOUD_USER:?NEXTCLOUD_USER must be set}
      NEXTCLOUD_PASSWORD: ${NEXTCLOUD_PASSWORD:?NEXTCLOUD_PASSWORD must be set}
      API_KEY: ${API_KEY:?API_KEY must be set}
      MODEL_PATH: /app/model.pth
      MAX_FILE_SIZE: ${MAX_FILE_SIZE:-10485760}
      MAX_FILES_PER_REQUEST: ${MAX_FILES_PER_REQUEST:-20}
      NEXTCLOUD_TIMEOUT: ${NEXTCLOUD_TIMEOUT:-15}
      NEXTCLOUD_RETRY_ATTEMPTS: ${NEXTCLOUD_RETRY_ATTEMPTS:-3}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8877}
    ports:
      - "8877:8877"
    depends_on:
      nextcloud:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8877/health/live')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    volumes:
      - ./model_checkpoint.pth:/app/model.pth:ro
      - uploads_data:/app/uploads
    networks:
      - app-network
    restart: unless-stopped
    mem_limit: 2g
    cpus: 2.0

  nextcloud:
    image: nextcloud:33-apache
    environment:
      POSTGRES_HOST: nextcloud-db
      POSTGRES_DB: ${NEXTCLOUD_DB_NAME:-nextcloud}
      POSTGRES_USER: ${NEXTCLOUD_DB_USER:-nextcloud}
      POSTGRES_PASSWORD: ${NEXTCLOUD_DB_PASSWORD:?NEXTCLOUD_DB_PASSWORD must be set}

      NEXTCLOUD_ADMIN_USER: ${NEXTCLOUD_USER:?NEXTCLOUD_USER must be set}
      NEXTCLOUD_ADMIN_PASSWORD: ${NEXTCLOUD_PASSWORD:?NEXTCLOUD_PASSWORD must be set}
      NEXTCLOUD_TRUSTED_DOMAINS: |
        localhost
        127.0.0.1
        nextcloud
        nextcloud:80
        app

      NEXTCLOUD_FILELOCKING_ENABLED: "true"
      NEXTCLOUD_FILELOCKING_TTL: "360"
      NEXTCLOUD_BACKGROUNDJOBS_MODE: "ajax"
      NEXTCLOUD_AUTOINSTALL: "true"
    ports:
      - "${NEXTCLOUD_PORT:-30540}:80"
    volumes:
      - nextcloud_data:/var/www/html/data
      - nextcloud_config:/var/www/html/config
    depends_on:
      nextcloud-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://localhost/status.php | grep --quiet '\"installed\":true'"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    networks:
      - app-network
    restart: unless-stopped
    mem_limit: 1g
    cpus: 1.0

networks:
  app-network:
    driver: bridge

volumes:
  nextcloud_db_data:
  nextcloud_data:
  nextcloud_config:
  uploads_data:
