default_install_hook_types: [pre-commit, pre-push]
fail_fast: false

repos:
  - repo: local
    hooks:
      - id: poetry-check
        name: Validate Poetry configuration and lock file
        entry: .venv/bin/poetry check --lock
        language: system
        pass_filenames: false
        files: ^(pyproject\.toml|poetry\.lock)$

      - id: ruff-check
        name: Ruff lint
        entry: .venv/bin/ruff check --fix
        language: system
        types: [python]

      - id: ruff-format
        name: Ruff format
        entry: .venv/bin/ruff format
        language: system
        types: [python]

      - id: tests
        name: Unit tests
        entry: .venv/bin/pytest -q
        language: system
        pass_filenames: false
        stages: [pre-push]

      - id: compose-config
        name: Validate Docker Compose
        entry: scripts/check-compose.sh
        language: script
        pass_filenames: false
        files: ^docker-compose\.yml$
